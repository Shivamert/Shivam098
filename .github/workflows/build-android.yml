name: Build RoutineFlow Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Check out repository
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 (Required by AGP 8.3.0 and Kotlin 1.9.22)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Android SDK components
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # Step 4: Configure Gradle and caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # Step 5: Ensure gradlew is executable
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # Step 6: Build Android Debug APK
      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --info

      # Step 7: Verify generated APK
      - name: Verify APK output
        run: |
          echo "Checking APK output directory..."
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk || { echo "ERROR: app-debug.apk was not generated"; exit 1; }

      # Step 8: Upload Debug APK as GitHub Actions Artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: routineflow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Step 9: Preserve build logs and reports if failure occurs
      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
