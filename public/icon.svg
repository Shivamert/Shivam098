<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="rf-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="rf-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312e81" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#rf-grad)" filter="url(#rf-shadow)" />
  
  <!-- Outer circular cycle flow -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="24" stroke-linecap="round" />
  
  <path d="M 256 116 A 140 140 0 1 1 126 295" fill="none" stroke="url(#rf-accent)" stroke-width="24" stroke-linecap="round" stroke-dasharray="24 16" />
  
  <!-- Center Checkmark & Loop -->
  <circle cx="256" cy="256" r="84" fill="#ffffff" />
  <path d="M 220 256 L 246 282 L 298 228" fill="none" stroke="#4f46e5" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
</svg>
